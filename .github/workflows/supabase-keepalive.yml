# Supabase pauses free projects after 7 days without activity. This reads one row from
# the public site_settings table every 6 days so the database never goes idle.
# It uses the publishable key (read-only, RLS applies), so it can't change anything.
name: Supabase keep-alive

on:
  schedule:
    # 06:17 UTC on days 1, 7, 13, 19, 25 and 31: never more than 6 days apart.
    - cron: "17 6 */6 * *"
  workflow_dispatch: # "Run workflow" button for a manual test

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Add SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY under Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Retries cover a brief outage; a final failure turns the run red and GitHub emails you.
          body=$(curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 20 --retry-all-errors --max-time 30 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            "${SUPABASE_URL%/}/rest/v1/site_settings?select=id&limit=1")
          echo "Supabase answered: $body"
